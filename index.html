<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏁 WORD RACE - AUDIO EDITION</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2ed573;
            --accent: #ffa502;
            --dark: #1e272e;
            --light: #ffffff;
            --shadow: 0 12px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', Gadget, sans-serif; }

        body {
            background: #1e272e;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            background: #2c3e50;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- PAGES --- */
        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #home-page {
            background: url('home_bg.png') center center / cover no-repeat;
            background-color: #1e272e;
        }

        .btn-start { background: var(--secondary); color: white; font-size: 2.5rem; border-radius: 100px; padding: 1rem 3rem; cursor: pointer; border: none; box-shadow: 0 8px 0 #16a085; }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 4px 0 #16a085; }

        /* --- LAYOUT --- */
        .top-section {
            height: 65vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-bottom: 8px solid var(--dark);
        }

        .scoreboard {
            height: 80px;
            background: var(--dark);
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: white;
            padding: 0 20px;
        }

        .race-area {
            flex-grow: 1;
            display: flex;
            padding: 15px;
            gap: 15px;
        }

        .team-sidebar {
            width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.9);
            border-radius: 25px;
            border: 5px solid var(--dark);
        }

        .team-sidebar img { width: 120px; height: 120px; object-fit: contain; }

        .tracks-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        .track {
            height: 42%;
            background: #333;
            border-radius: 25px;
            position: relative;
            border: 6px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
        }

        .finish-line {
            position: absolute;
            right: 0;
            width: 60px;
            height: 100%;
            background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 50% / 20px 20px;
            border-left: 8px solid gold;
            border-radius: 0 18px 18px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .racer {
            position: absolute;
            width: 130px;
            height: 130px;
            left: 0;
            transition: left 0.5s ease-out;
            z-index: 5;
        }

        .racer img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5)); }

        /* --- BOTTOM SECTION --- */
        .bottom-section {
            height: 35vh;
            width: 100%;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            background: #16212d;
        }

        .number-box {
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            cursor: pointer;
            border: 6px solid var(--dark);
            box-shadow: 0 8px 0 #000;
            transition: transform 0.1s;
        }
        
        .number-box:active { transform: translateY(4px); box-shadow: 0 4px 0 #000; }
        .number-box.used { opacity: 0.2; pointer-events: none; background: #95a5a6; box-shadow: none; color: white; }

        /* --- MODALS --- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .puzzle-window {
            width: 98%;
            height: 94%;
            background: white;
            border-radius: 30px;
            border: 15px solid var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            justify-content: space-between;
        }

        .puzzle-img { height: 40%; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        .puzzle-img img { height: 100%; max-width: 90%; border-radius: 20px; object-fit: contain; border: 8px solid #f1f2f6; }

        .letter-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            width: 100%;
            padding: 10px;
        }

        .letter-btn {
            width: 110px;
            height: 110px;
            font-size: 5rem;
            background: var(--dark);
            color: white;
            border-radius: 20px;
            border: none;
            box-shadow: 0 8px 0 #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #answer-slots {
            display: flex;
            gap: 15px;
            min-height: 120px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .slot {
            width: 80px;
            height: 100px;
            border-bottom: 12px solid #2c3e50;
            font-size: 6.5rem;
            text-align: center;
            line-height: 40px;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- FEEDBACK OVERLAY --- */
        .feedback-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.95);
            text-align: center;
            padding: 40px;
        }

        .correct-reveal {
            font-size: 8rem;
            color: white;
            background: #2c3e50;
            padding: 20px 60px;
            border-radius: 30px;
            border: 10px solid #ecf0f1;
            margin: 30px 0;
            letter-spacing: 15px;
            text-shadow: 4px 4px 0 #000;
        }

        .fullscreen-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 50;
            background: white;
            border: 3px solid #000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- AUDIO CONTROLS --- */
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.1);
            padding: 10px 30px;
            border-radius: 50px;
            margin-top: 10px;
        }

        .audio-btn {
            background: var(--accent);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #d35400;
            transition: transform 0.1s;
        }

        .audio-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d35400; }
        .audio-btn svg { width: 40px; height: 40px; fill: white; }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .volume-slider {
            width: 150px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <button class="fullscreen-btn" onclick="toggleFullscreen()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
    </button>

    <div id="game-container">
        <!-- START PAGE -->
        <div id="home-page" class="page">
            <div style="background: rgba(255,255,255,0.95); padding: 50px 80px; border-radius: 40px; text-align: center; border: 15px solid #000; margin-bottom: 30px; box-shadow: var(--shadow);">
                <h1 style="font-size: 8rem; line-height: 1; margin-bottom: 10px; color: var(--dark);">🏁 WORD RACE</h1>
                <h2 style="font-size: 3rem; color: var(--primary);">LEVEL UP YOUR VOCAB!</h2>
            </div>
            <button class="btn-start" style="font-size: 4rem; padding: 1.5rem 5rem;" onclick="startGame()">START GAME</button>
        </div>

        <!-- GAME INTERFACE -->
        <div id="game-screen" class="page" style="display:none; position:relative;">
            <div class="top-section">
                <div class="scoreboard">
                    <div style="text-align:center">
                        <p style="font-size:1.2rem; color:#1e90ff">TEAM 1 WINS</p>
                        <h1 id="score-1" style="font-size:3rem">0</h1>
                    </div>
                    <div id="turn-indicator" style="padding: 10px 40px; border-radius: 50px; font-size: 2rem; box-shadow: 0 4px 0 rgba(0,0,0,0.2);">TEAM 1 TURN</div>
                    <div style="text-align:center">
                        <p style="font-size:1.2rem; color:#ff4757">TEAM 2 WINS</p>
                        <h1 id="score-2" style="font-size:3rem">0</h1>
                    </div>
                </div>

                <div class="race-area">
                    <div class="team-sidebar">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=team1">
                        <h3 style="color:#1e90ff; font-size: 1.5rem;">TEAM 1</h3>
                    </div>
                    <div class="tracks-container">
                        <div class="track" id="track-1">
                            <div class="finish-line">🏁</div>
                            <div id="racer-1" class="racer">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=team1">
                            </div>
                        </div>
                        <div class="track" id="track-2">
                            <div class="finish-line">🏁</div>
                            <div id="racer-2" class="racer">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=team2">
                            </div>
                        </div>
                    </div>
                    <div class="team-sidebar">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=team2">
                        <h3 style="color:#ff4757; font-size: 1.5rem;">TEAM 2</h3>
                    </div>
                </div>
            </div>

            <div id="number-grid" class="bottom-section"></div>
        </div>

        <!-- PUZZLE MODAL -->
        <div id="puzzle-modal" class="modal">
            <div style="width:90%; height:30px; background:#333; border:5px solid white; border-radius:15px; margin-bottom:15px; overflow:hidden;">
                <div id="timer-bar" style="width:100%; height:100%; background:var(--secondary); transition: width 1s linear;"></div>
            </div>
            <div class="puzzle-window">
                <div id="puzzle-image" class="puzzle-img"></div>
                
                <!-- Audio Controls in Modal -->
                <div class="audio-controls">
                    <button class="audio-btn" onclick="playCurrentWordAudio()">
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    </button>
                    <div class="volume-control">
                        <span style="font-size: 1.5rem;">🔈</span>
                        <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)">
                        <span style="font-size: 1.5rem;">🔊</span>
                    </div>
                </div>

                <div id="answer-slots"></div>
                <div id="letter-bank" class="letter-bank"></div>
                <div style="display:flex; gap:15px; width:100%; margin-top:10px;">
                    <button class="btn-start" style="background:#e67e22; flex:1; font-size:2.5rem; box-shadow: 0 8px 0 #d35400;" onclick="clearInput()">CLEAR</button>
                    <button class="btn-start" style="background:#34495e; flex:1; font-size:2.5rem; box-shadow: 0 8px 0 #2c3e50;" onclick="backspace()">⬅️</button>
                    <button class="btn-start" style="flex:2; font-size:2.5rem; box-shadow: 0 8px 0 #27ae60;" onclick="submitGuess()">SUBMIT</button>
                </div>
            </div>
        </div>

        <div id="feedback-overlay" class="feedback-overlay"></div>
    </div>

    <script>
        const ALL_WORDS = [
            { w: "SUNDAY", i: "sunday.png", a: "sunday.mp3" }, { w: "MONDAY", i: "monday.png", a: "monday.mp3" },
            { w: "TUESDAY", i: "tuesday.png", a: "tuesday.mp3" }, { w: "WEDNESDAY", i: "wednesday.png", a: "wednesday.mp3" },
            { w: "THURSDAY", i: "thursday.png", a: "thursday.mp3" }, { w: "FRIDAY", i: "friday.png", a: "friday.mp3" },
            { w: "SATURDAY", i: "saturday.png", a: "saturday.mp3" }, { w: "WEATHER", i: "weather.png", a: "weather.mp3" },
            { w: "SUNNY", i: "sunny.png", a: "sunny.mp3" }, { w: "WINDY", i: "windy.png", a: "windy.mp3" },
            { w: "RAINY", i: "rainy.png", a: "rainy.mp3" }, { w: "CLOUDY", i: "cloudy.png", a: "cloudy.mp3" },
            { w: "SNOWY", i: "snowy.png", a: "snowy.mp3" }, { w: "STORMY", i: "stormy.png", a: "stormy.mp3" },
            { w: "SEASON", i: "season.png", a: "season.mp3" }, { w: "SUMMER", i: "summer.png", a: "summer.mp3" },
            { w: "WINTER", i: "winter.png", a: "winter.mp3" }, { w: "FALL", i: "fall.png", a: "fall.mp3" },
            { w: "SPRING", i: "spring.png", a: "spring.mp3" }, { w: "CAP", i: "cap.png", a: "cap.mp3" },
            { w: "HAT", i: "hat.png", a: "hat.mp3" }, { w: "T-SHIRT", i: "tshirt.png", a: "tshirt.mp3" },
            { w: "SCARF", i: "scarf.png", a: "scarf.mp3" }, { w: "RAINCOAT", i: "raincoat.png", a: "raincoat.mp3" },
            { w: "JEANS", i: "jeans.png", a: "jeans.mp3" }, { w: "SHORTS", i: "shorts.png", a: "shorts.mp3" },
            { w: "JACKET", i: "jacket.png", a: "jacket.mp3" }, { w: "SWEATER", i: "sweater.png", a: "sweater.mp3" },
            { w: "RAIN BOOTS", i: "rainboots.png", a: "rainboots.mp3" }, { w: "GLOVES", i: "gloves.png", a: "gloves.mp3" },
            { w: "SUNGLASSES", i: "sunglasses.png", a: "sunglasses.mp3" }
        ];

        let state = {
            turn: 1, wins: [0, 0], pos: [0, 0],
            used: new Set(), currentWord: "", currentAudio: "", userInput: [],
            roundWords: [], roundSteps: [], timer: 30, timerInt: null, moving: false,
            lastClickedBtnIndices: [],
            volume: 0.5
        };

        const globalAudio = new Audio();

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function playCurrentWordAudio() {
            if (state.currentAudio) {
                globalAudio.src = state.currentAudio;
                globalAudio.volume = state.volume;
                globalAudio.play().catch(e => console.log("Audio failed to play", e));
            }
        }

        function changeVolume(val) {
            state.volume = parseFloat(val);
            globalAudio.volume = state.volume;
        }

        function startGame() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            resetGrid();
            updateUI();
        }

        function resetGrid() {
            const shuffledWords = [...ALL_WORDS].sort(() => Math.random() - 0.5);
            state.roundWords = shuffledWords.slice(0, 10);
            const stepsPool = [1, 1, 2, 2, 3, 3, 1, 2, -1, -2];
            state.roundSteps = stepsPool.sort(() => Math.random() - 0.5);
            state.used.clear();
            const grid = document.getElementById('number-grid');
            grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const b = document.createElement('div');
                b.className = `number-box`;
                b.id = `box-${i}`;
                b.innerText = i + 1;
                b.onclick = () => openPuzzle(i);
                grid.appendChild(b);
            }
        }

        function openPuzzle(idx) {
            if(state.used.has(idx) || state.moving) return;
            state.used.add(idx);
            document.getElementById(`box-${idx}`).classList.add('used');
            const p = state.roundWords[idx];
            state.currentWord = p.w.toUpperCase();
            state.currentAudio = p.a;
            state.userInput = Array(state.currentWord.length).fill("");
            state.lastClickedBtnIndices = Array(state.currentWord.length).fill(null);
            state.boxVal = state.roundSteps[idx];
            
            document.getElementById('puzzle-image').innerHTML = `<img src="${p.i}" onerror="this.parentElement.innerHTML='<h1 style=\'font-size:12rem\'>${state.currentWord}</h1>'">`;
            
            const slots = document.getElementById('answer-slots');
            slots.innerHTML = '';
            [...state.currentWord].forEach((char, i) => {
                const s = document.createElement('div');
                s.className = 'slot';
                if (char === ' ' || char === '-') {
                    s.innerText = char;
                    s.style.borderBottom = 'none';
                    state.userInput[i] = char;
                }
                slots.appendChild(s);
            });
            const bank = document.getElementById('letter-bank');
            bank.innerHTML = '';
            const rawLetters = state.currentWord.replace(/[^A-Z]/g, '').split('');
            const letters = rawLetters.map((l, i) => ({l, i})).sort(() => Math.random() - 0.5);
            letters.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.id = `btn-letter-${item.i}`;
                btn.innerText = item.l;
                btn.onclick = () => {
                    const emptyIdx = state.userInput.findIndex((v, i) => v === "" && state.currentWord[i] !== ' ' && state.currentWord[i] !== '-');
                    if(emptyIdx !== -1) {
                        state.userInput[emptyIdx] = item.l;
                        state.lastClickedBtnIndices[emptyIdx] = item.i;
                        slots.children[emptyIdx].innerText = item.l;
                        btn.style.opacity = '0.1';
                        btn.style.pointerEvents = 'none';
                    }
                };
                bank.appendChild(btn);
            });
            document.getElementById('puzzle-modal').style.display = 'flex';
            
            // Auto play audio when puzzle opens
            setTimeout(playCurrentWordAudio, 500);
            
            startTimer();
        }

        function backspace() {
            for(let i = state.userInput.length - 1; i >= 0; i--) {
                const char = state.currentWord[i];
                if (char !== ' ' && char !== '-' && state.userInput[i] !== "") {
                    const btnIdx = state.lastClickedBtnIndices[i];
                    document.getElementById('answer-slots').children[i].innerText = '';
                    state.userInput[i] = "";
                    state.lastClickedBtnIndices[i] = null;
                    const btn = document.getElementById(`btn-letter-${btnIdx}`);
                    if(btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
                    break;
                }
            }
        }

        function clearInput() {
            const slots = document.getElementById('answer-slots').children;
            for(let i=0; i < state.currentWord.length; i++) {
                if (state.currentWord[i] !== ' ' && state.currentWord[i] !== '-') {
                    const btnIdx = state.lastClickedBtnIndices[i];
                    const btn = document.getElementById(`btn-letter-${btnIdx}`);
                    if(btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
                    slots[i].innerText = '';
                    state.userInput[i] = "";
                    state.lastClickedBtnIndices[i] = null;
                }
            }
        }

        function startTimer() {
            state.timer = 30;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            clearInterval(state.timerInt);
            state.timerInt = setInterval(() => {
                state.timer--;
                bar.style.width = (state.timer / 30 * 100) + '%';
                if(state.timer <= 0) {
                    clearInterval(state.timerInt);
                    handleResult(false, true);
                }
            }, 1000);
        }

        function submitGuess() {
            const currentGuess = state.userInput.join('');
            if(currentGuess.length < state.currentWord.length) return;
            clearInterval(state.timerInt);
            handleResult(currentGuess === state.currentWord, false);
        }

        function handleResult(isCorrect, isTimeout) {
            document.getElementById('puzzle-modal').style.display = 'none';
            const overlay = document.getElementById('feedback-overlay');
            overlay.style.display = 'flex';

            let moveVal = isCorrect ? state.boxVal : -3;
            let resultColor = moveVal >= 0 ? "var(--secondary)" : "var(--primary)";
            
            let phrase = "";
            if (moveVal === 1) phrase = "+1 Good Job!";
            else if (moveVal === 2) phrase = "+2 Great!";
            else if (moveVal === 3) phrase = "+3 Amazing!";
            else if (moveVal === -1) phrase = "-1 Oops!";
            else if (moveVal === -2) phrase = "-2 Oh No!";
            else if (moveVal === -3) phrase = "-3 Bad Luck!";
            else phrase = `${moveVal > 0 ? '+' : ''}${moveVal}`;

            let mainMsg = isCorrect ? "CORRECT!" : (isTimeout ? "TIME'S UP!" : "INCORRECT!");
            
            // Audio controls repeated in feedback for re-listening
            let html = `
                <h2 style="color:white; font-size:4rem; margin-bottom:10px;">${mainMsg}</h2>
                <div class="audio-controls" style="margin: 20px 0;">
                    <button class="audio-btn" onclick="playCurrentWordAudio()">
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    </button>
                    <div class="volume-control">
                        <span style="font-size: 1.5rem; color:white;">🔈</span>
                        <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="${state.volume}" oninput="changeVolume(this.value)">
                        <span style="font-size: 1.5rem; color:white;">🔊</span>
                    </div>
                </div>
            `;

            if (!isCorrect) {
                html += `
                    <p style="color:white; font-size:2rem; margin-bottom:10px;">THE WORD WAS:</p>
                    <div class="correct-reveal">${state.currentWord}</div>
                `;
            }

            html += `
                <h1 style="color:${resultColor}; font-size:9rem; margin: 20px 0; background:rgba(255,255,255,0.1); padding:40px 100px; border-radius:100px; border: 15px dashed ${resultColor}; text-shadow: 4px 4px 0 rgba(0,0,0,0.5);">${phrase}</h1>
            `;

            overlay.innerHTML = html;
            
            // Play audio again on feedback screen
            playCurrentWordAudio();

            setTimeout(() => {
                overlay.style.display = 'none';
                animateMove(state.turn, moveVal);
            }, isCorrect ? 3000 : 5000);
        }

        function animateMove(team, steps) {
            if(steps === 0) { nextTurn(); return; }
            state.moving = true;
            let count = Math.abs(steps);
            let dir = steps > 0 ? 1 : -1;
            let idx = team - 1;
            let interval = setInterval(() => {
                if(count <= 0) {
                    clearInterval(interval);
                    state.moving = false;
                    if(state.pos[idx] >= 10) winRace(team);
                    else nextTurn();
                    return;
                }
                state.pos[idx] = Math.max(0, Math.min(10, state.pos[idx] + dir));
                updateRacers();
                count--;
            }, 500);
        }

        function updateRacers() {
            const track = document.querySelector('.track');
            if (!track) return;
            const trackWidth = track.offsetWidth - 160;
            document.getElementById('racer-1').style.left = (state.pos[0] * (trackWidth/10)) + 'px';
            document.getElementById('racer-2').style.left = (state.pos[1] * (trackWidth/10)) + 'px';
        }

        function winRace(team) {
            state.wins[team-1]++;
            updateUI();
            const overlay = document.getElementById('feedback-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `<h1 style="color:gold; font-size:10rem;">🏆 TEAM ${team} WINS!</h1>`;
            setTimeout(() => {
                state.pos = [0, 0];
                updateRacers();
                overlay.style.display = 'none';
                resetGrid();
                nextTurn();
            }, 4000);
        }

        function nextTurn() {
            state.turn = state.turn === 1 ? 2 : 1;
            updateUI();
            if(state.used.size >= 10) {
                setTimeout(resetGrid, 500);
            }
        }

        function updateUI() {
            document.getElementById('score-1').innerText = state.wins[0];
            document.getElementById('score-2').innerText = state.wins[1];
            const ind = document.getElementById('turn-indicator');
            ind.innerText = `TEAM ${state.turn} TURN`;
            ind.style.background = state.turn === 1 ? '#1e90ff' : '#ff4757';
            ind.style.color = 'white';
        }

        window.onresize = updateRacers;
    </script>
</body>
</html>
